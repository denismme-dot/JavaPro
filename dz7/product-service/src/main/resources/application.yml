server:
  port: 8081

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://172.28.128.173:5432/u2
    username: dbman
    password: tkk
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: product-service-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: java

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: java
    default-schema: java
    baseline-on-migrate: true